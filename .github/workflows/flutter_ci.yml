name: Flutter CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    working-directory: flutter_app

jobs:
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift & Riverpod code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

  build-android:
    name: Build Android (debug APK)
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Write release keystore and key.properties
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > android/app/release-keystore.jks
            {
              echo "storePassword=${STORE_PASSWORD}"
              echo "keyPassword=${KEY_PASSWORD}"
              echo "keyAlias=${KEY_ALIAS}"
              echo "storeFile=release-keystore.jks"
            } > android/key.properties
          fi

      - name: Build debug APK
        run: |
          BASE=$(grep '^version:' pubspec.yaml | sed 's/version: *//;s/+.*//')
          flutter build apk --debug \
            --build-name="${BASE}-dev" \
            --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  build-linux:
    name: Build Linux .deb
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        working-directory: .
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev libjsoncpp-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Linux release
        run: |
          BASE=$(grep '^version:' pubspec.yaml | sed 's/version: *//;s/+.*//')
          flutter build linux --release \
            --build-name="${BASE}-dev" \
            --build-number=${{ github.run_number }}

      - name: Package as .deb
        run: |
          BASE=$(grep '^version:' pubspec.yaml | sed 's/version: *//;s/+.*//')
          DEB_VERSION="${BASE}~dev+${{ github.run_number }}"
          PKG=awoma_${DEB_VERSION}_amd64

          # Directory tree
          mkdir -p ${PKG}/DEBIAN
          mkdir -p ${PKG}/opt/awoma
          mkdir -p ${PKG}/usr/bin
          mkdir -p ${PKG}/usr/share/applications
          mkdir -p ${PKG}/usr/share/icons/hicolor/256x256/apps

          # Flutter bundle
          cp -r build/linux/x64/release/bundle/. ${PKG}/opt/awoma/

          # Icon (reuse macOS 256x256 asset)
          cp macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_256.png \
            ${PKG}/usr/share/icons/hicolor/256x256/apps/awoma.png

          # Symlink launcher → binary
          ln -s /opt/awoma/artworks_manager ${PKG}/usr/bin/awoma

          # Desktop entry
          cat > ${PKG}/usr/share/applications/awoma.desktop <<'EOF'
          [Desktop Entry]
          Version=1.0
          Name=AWoMa
          Comment=Personal artwork catalogue
          Exec=/opt/awoma/artworks_manager
          Icon=awoma
          Terminal=false
          Type=Application
          Categories=Graphics;Education;
          EOF

          # Control file
          cat > ${PKG}/DEBIAN/control <<EOF
          Package: awoma
          Version: ${DEB_VERSION}
          Architecture: amd64
          Maintainer: Cythraul89 <dominik.hilber@gmail.com>
          Depends: libgtk-3-0, libglib2.0-0, libstdc++6, libsecret-1-0, libjsoncpp25
          Description: AWoMa — personal artwork catalogue
           Cross-platform artwork collection manager with Nextcloud backup support.
          EOF

          dpkg-deb --build --root-owner-group ${PKG} awoma-linux-amd64.deb

      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: flutter_app/awoma-linux-amd64.deb
          retention-days: 14

  build-macos:
    name: Build macOS
    needs: analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Disable macOS sandbox (CI only)
        working-directory: flutter_app/macos
        run: |
          /usr/libexec/PlistBuddy -c \
            "Delete :com.apple.security.app-sandbox" \
            Runner/DebugProfile.entitlements || true
          /usr/libexec/PlistBuddy -c \
            "Delete :com.apple.security.app-sandbox" \
            Runner/Release.entitlements || true

      - name: Build macOS release
        run: |
          BASE=$(grep '^version:' pubspec.yaml | sed 's/version: *//;s/+.*//')
          flutter build macos --release \
            --build-name="${BASE}-dev" \
            --build-number=${{ github.run_number }}

      - name: Archive app bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/AWoMa.app \
            awoma-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: flutter_app/awoma-macos.zip
          retention-days: 14

  build-ios:
    name: Build iOS (no-codesign)
    needs: analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS (simulator, no code signing)
        run: |
          BASE=$(grep '^version:' pubspec.yaml | sed 's/version: *//;s/+.*//')
          flutter build ios --debug --no-codesign \
            --build-name="${BASE}-dev" \
            --build-number=${{ github.run_number }}

  build-windows:
    name: Build Windows
    needs: analyze
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows release
        run: |
          $BASE = (Select-String -Path pubspec.yaml -Pattern '^version:').Line `
            -replace 'version:\s*', '' -replace '\+.*', ''
          flutter build windows --release `
            --build-name="$BASE-dev" `
            --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: flutter_app/build/windows/x64/runner/Release/
          retention-days: 14

  sbom:
    name: SBOM (CycloneDX)
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: anchore/sbom-action@v0
        with:
          path: ./flutter_app
          format: cyclonedx-json
          artifact-name: awoma-sbom.cdx.json
          output-file: awoma-sbom.cdx.json
          upload-release-assets: false
