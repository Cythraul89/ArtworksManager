name: Flutter Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

defaults:
  run:
    working-directory: flutter_app

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Write release keystore and key.properties
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/app/release-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${STORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=app/release-keystore.jks
          EOF

      - name: Build release APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

  build-linux:
    name: Linux .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        working-directory: .
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev libjsoncpp-dev \
            libnotify-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Linux release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          flutter build linux --release \
            --build-name="$VERSION" \
            --build-number=${{ github.run_number }}

      - name: Package as .deb
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG=awoma_${VERSION}_amd64

          # Directory tree
          mkdir -p ${PKG}/DEBIAN
          mkdir -p ${PKG}/opt/awoma
          mkdir -p ${PKG}/usr/bin
          mkdir -p ${PKG}/usr/share/applications
          mkdir -p ${PKG}/usr/share/icons/hicolor/256x256/apps

          # Flutter bundle
          cp -r build/linux/x64/release/bundle/. ${PKG}/opt/awoma/

          # Icon (reuse macOS 256x256 asset)
          cp macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_256.png \
            ${PKG}/usr/share/icons/hicolor/256x256/apps/awoma.png

          # Symlink launcher → binary
          ln -s /opt/awoma/artworks_manager ${PKG}/usr/bin/awoma

          # Desktop entry
          cat > ${PKG}/usr/share/applications/awoma.desktop <<'EOF'
          [Desktop Entry]
          Version=1.0
          Name=AWoMa
          Comment=Personal artwork catalogue
          Exec=/opt/awoma/artworks_manager
          Icon=awoma
          Terminal=false
          Type=Application
          Categories=Graphics;Education;
          EOF

          # Control file
          cat > ${PKG}/DEBIAN/control <<EOF
          Package: awoma
          Version: ${VERSION}
          Architecture: amd64
          Maintainer: Cythraul89 <dominik.hilber@gmail.com>
          Depends: libgtk-3-0, libglib2.0-0, libstdc++6, libsecret-1-0
          Description: AWoMa — personal artwork catalogue
           Cross-platform artwork collection manager with Nextcloud backup support.
          EOF

          dpkg-deb --build --root-owner-group ${PKG} awoma-linux-amd64.deb

      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: flutter_app/awoma-linux-amd64.deb

  build-windows:
    name: Windows bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows release
        run: |
          $VERSION = $env:GITHUB_REF_NAME -replace '^v', ''
          flutter build windows --release `
            --build-name="$VERSION" `
            --build-number=${{ github.run_number }}

      - name: Archive bundle
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath awoma-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: flutter_app/awoma-windows-x64.zip

  build-macos:
    name: macOS app
    runs-on: macos-latest
    env:
      HAVE_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # When a Developer ID certificate is available, import it so Flutter's
      # build picks it up and produces a properly signed .app.
      - name: Import signing certificate
        if: env.HAVE_CERT == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      # Without a certificate, strip the sandbox so the unsigned app can be
      # opened without Gatekeeper blocking it.
      - name: Disable macOS sandbox (unsigned builds only)
        if: env.HAVE_CERT == 'false'
        working-directory: flutter_app/macos
        run: |
          /usr/libexec/PlistBuddy -c \
            "Delete :com.apple.security.app-sandbox" \
            Runner/DebugProfile.entitlements || true
          /usr/libexec/PlistBuddy -c \
            "Delete :com.apple.security.app-sandbox" \
            Runner/Release.entitlements || true

      - name: Build macOS release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          flutter build macos --release \
            --build-name="$VERSION" \
            --build-number=${{ github.run_number }}

      - name: Archive app bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/AWoMa.app \
            awoma-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: flutter_app/awoma-macos.zip

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: anchore/sbom-action@v0
        with:
          path: ./flutter_app
          format: cyclonedx-json
          artifact-name: awoma-sbom.cdx.json
          output-file: awoma-sbom.cdx.json
          upload-release-assets: false

  release:
    name: GitHub Release
    needs: [build-android, build-linux, build-windows, build-macos, sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
