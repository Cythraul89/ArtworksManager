name: artworks_manager
description: Cross-platform artwork collection manager with Nextcloud backup.
publish_to: none
version: 0.2.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management (manual providers — no code generation needed)
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # Database
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # HTTP / Nextcloud WebDAV
  dio: ^5.4.3

  # File handling
  file_picker: ^8.1.0
  image_picker: ^1.1.2
  open_filex: ^4.4.1

  # Serialization / Backup
  archive: ^3.6.1

  # Utilities
  flutter_secure_storage: ^9.2.2
  uuid: ^4.4.0
  intl: ^0.19.0
  crypto: ^3.0.3
  permission_handler: ^11.3.1

  # PDF generation & sharing
  pdf: ^3.11.1
  printing: ^5.13.2

  # Background tasks (Android only; no-op on macOS/Linux)
  workmanager: ^0.6.0
  device_info_plus: ^10.1.0

  # App version / about screen
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.11
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
