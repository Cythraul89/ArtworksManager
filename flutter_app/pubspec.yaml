name: artworks_manager
description: Cross-platform artwork collection manager with Nextcloud backup.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management (manual providers — no code generation needed)
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # Database
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # HTTP / Nextcloud WebDAV
  dio: ^5.4.3

  # File handling
  file_picker: ^8.1.0
  image_picker: ^1.1.2
  share_plus: ^10.0.0
  open_filex: ^4.4.1

  # UI
  cached_network_image: ^3.3.1

  # Serialization / Backup
  archive: ^3.6.1

  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  equatable: ^2.0.5
  crypto: ^3.0.3

  # Background tasks (Android only; no-op on macOS/Linux)
  workmanager: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
